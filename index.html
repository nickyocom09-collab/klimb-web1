<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Pinch-zoom stays enabled for accessibility; iOS input-focus zoom is
       prevented by keeping all form controls at >=16px (see index.css). -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Klimb</title>

  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#04130c">
  <!-- Standalone (home-screen) status bar: keep it dark, never the default white. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="apple-touch-icon" href="/klimb.logo-removebg-preview.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">

  <!-- Warm up the map tile CDN so the first map open paints fast. -->
  <link rel="preconnect" href="https://a.basemaps.cartocdn.com" crossorigin>
  <link rel="preconnect" href="https://b.basemaps.cartocdn.com" crossorigin>
  <link rel="preconnect" href="https://c.basemaps.cartocdn.com" crossorigin>

  <!-- Pre-JS splash so the very first paint is branded, not blank. React
       replaces #root on mount, removing this automatically. Styles are inline
       here (the stylesheet hasn't loaded yet at first paint). -->
  <style>
    /* Boot splash — the Klimb mark on pure black. Calm and quiet: the tile
       eases in, then breathes gently. No text, no spinners. Mirrors
       .klimb-splash in the app stylesheet for a seamless handoff. */
    #boot-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #111111;
    }
    #boot-splash .mark {
      width: min(104px, 26vw);
      height: min(104px, 26vw);
      color: #f2efe8;
      animation: boot-in 1.8s cubic-bezier(0.33, 0, 0.15, 1) both;
    }
    @keyframes boot-in {
      0% { transform: scale(0.985); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      #boot-splash .mark { animation: none; }
    }
  </style>
</head>

<body>
  <div id="root">
    <div id="boot-splash">
      <svg class="mark" viewBox="0 0 100 112" role="img" aria-label="Klimb" xmlns="http://www.w3.org/2000/svg">
        <path fill="currentColor" d="M18 12 30 3l12 9v31l6-6 4 4L78 13h13l-3 9 7 5-13 6-24 25 28 31 10-2-7 16H74l-5-11-24-25-3 3v21l7 5-11 11-12-9V64l-8 7-13-6 9-11 4 3V20l-6-4Zm24 35v8l8-9-4-4Zm0 22v11l4-5Z"/>
        <path fill="currentColor" d="m14 7 8 5-9 8H5Zm2 66 10 6-9 10H7Zm58-61 12 1-8 9-7-3Zm0 83 14 8-5 6-13-5Z"/>
      </svg>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
