<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Pinch-zoom stays enabled for accessibility; iOS input-focus zoom is
       prevented by keeping all form controls at >=16px (see index.css). -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Klimb</title>

  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1c1c1e">
  <!-- Standalone (home-screen) status bar: keep it dark, never the default white. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="apple-touch-icon" href="/klimb-app-icon.png">
  <link rel="preload" as="image" href="/klimb-splash-dark.png">
  <link rel="preload" as="image" href="/klimb-splash-light.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">

  <!-- Warm up the map tile CDN so the first map open paints fast. -->
  <link rel="preconnect" href="https://a.basemaps.cartocdn.com" crossorigin>
  <link rel="preconnect" href="https://b.basemaps.cartocdn.com" crossorigin>
  <link rel="preconnect" href="https://c.basemaps.cartocdn.com" crossorigin>

  <script>
    /* Two separate things, on purpose:

       1. data-theme  — the user's SAVED app theme. Drives the whole UI.
       2. data-launch — the DEVICE appearance. Drives the splash only.

       The native iOS launch screen can only follow the device appearance. If
       the splash followed the saved theme instead, a user on a dark phone with
       Klimb set to light saw the launch screen hard-cut from dark to white
       mid-boot. Matching the splash to the device keeps the native -> web
       handoff invisible; we then crossfade into the real theme. */
    try {
      var deviceLight = window.matchMedia("(prefers-color-scheme: light)").matches;
      var savedTheme = localStorage.getItem("klimb-theme");
      var bootTheme =
        savedTheme === "light" || savedTheme === "dark"
          ? savedTheme
          : deviceLight
            ? "light"
            : "dark";
      document.documentElement.dataset.theme = bootTheme;
      document.documentElement.dataset.launch = deviceLight ? "light" : "dark";
      document.documentElement.style.colorScheme = bootTheme;
      document
        .querySelector('meta[name="theme-color"]')
        .setAttribute("content", bootTheme === "light" ? "#ffffff" : "#1c1c1e");
    } catch (_) {}
  </script>
  <!-- Pre-JS splash. It sits OUTSIDE #root so React's first render can't rip it
       away in a single frame; main.tsx crossfades it out once the app mounts. -->
  <style>
    #boot-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #1c1c1e;
      /* Fades to reveal whatever is underneath (identical React splash, or the
         app itself) instead of cutting. */
      opacity: 1;
      transition: opacity 420ms ease;
    }
    #boot-splash.is-hiding { opacity: 0; }
    #boot-splash .mark {
      width: min(224px, 58vw);
      height: min(224px, 58vw);
      object-fit: contain;
      opacity: 1;
      transform: none;
    }
    /* Match the NATIVE launch screen, which follows the device appearance. */
    :root[data-launch="light"] #boot-splash { background: #fff; }
    #boot-splash .light-mark { display: none; }
    :root[data-launch="light"] #boot-splash .light-mark { display: block; }
    :root[data-launch="light"] #boot-splash .dark-mark { display: none; }
    @media (prefers-reduced-motion: reduce) {
      #boot-splash { transition-duration: 1ms; }
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <div id="boot-splash">
    <img class="mark dark-mark" src="/klimb-splash-dark.png" alt="Klimb" />
    <img class="mark light-mark" src="/klimb-splash-light.png" alt="Klimb" />
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
