<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Pinch-zoom stays enabled for accessibility; iOS input-focus zoom is
       prevented by keeping all form controls at >=16px (see index.css). -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Klimb</title>

  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#04130c">
  <!-- Standalone (home-screen) status bar: keep it dark, never the default white. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="apple-touch-icon" href="/klimb-app-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">

  <!-- Warm up the map tile CDN so the first map open paints fast. -->
  <link rel="preconnect" href="https://a.basemaps.cartocdn.com" crossorigin>
  <link rel="preconnect" href="https://b.basemaps.cartocdn.com" crossorigin>
  <link rel="preconnect" href="https://c.basemaps.cartocdn.com" crossorigin>

  <script>
    /* Paint the saved theme before the first frame so the launch handoff never
       flashes the opposite background. */
    try {
      var savedTheme = localStorage.getItem("klimb-theme");
      if (savedTheme === "light" || savedTheme === "dark") {
        document.documentElement.dataset.theme = savedTheme;
      }
    } catch (_) {}
  </script>
  <!-- Pre-JS splash. React replaces #root on mount. -->
  <style>
    #boot-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #1c1c1e;
    }
    #boot-splash .mark {
      width: min(224px, 58vw);
      height: min(224px, 58vw);
      object-fit: contain;
      animation: boot-in .55s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes boot-in {
      0% { transform: scale(0.94); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    :root[data-theme="light"] #boot-splash { background: #fff; }
    #boot-splash .light-mark { display: none; }
    :root[data-theme="light"] #boot-splash .light-mark { display: block; }
    :root[data-theme="light"] #boot-splash .dark-mark { display: none; }
    @media (prefers-reduced-motion: reduce) {
      #boot-splash .mark { animation: none; }
    }
  </style>
</head>

<body>
  <div id="root">
    <div id="boot-splash">
      <img class="mark dark-mark" src="/klimb-splash-dark.png" alt="Klimb" />
      <img class="mark light-mark" src="/klimb-splash-light.png" alt="Klimb" />
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
