<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Pinch-zoom stays enabled for accessibility; iOS input-focus zoom is
       prevented by keeping all form controls at >=16px (see index.css). -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Klimb</title>

  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1c1c1e">
  <!-- Standalone (home-screen) status bar: keep it dark, never the default white. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="apple-touch-icon" href="/klimb-app-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">

  <!-- Warm up the map tile CDN so the first map open paints fast. -->
  <link rel="preconnect" href="https://a.basemaps.cartocdn.com" crossorigin>
  <link rel="preconnect" href="https://b.basemaps.cartocdn.com" crossorigin>
  <link rel="preconnect" href="https://c.basemaps.cartocdn.com" crossorigin>

  <script>
    /* Paint the saved theme before the first frame. Klimb is dark-first: the
       default is dark and light is an explicit opt-in from Settings. Note the
       splash itself is always dark regardless — it mirrors the native launch
       screen, so there is only ever one launch look. */
    try {
      var savedTheme = localStorage.getItem("klimb-theme");
      var bootTheme = savedTheme === "light" ? "light" : "dark";
      document.documentElement.dataset.theme = bootTheme;
      document.documentElement.style.colorScheme = bootTheme;
      document
        .querySelector('meta[name="theme-color"]')
        .setAttribute("content", bootTheme === "light" ? "#ffffff" : "#1c1c1e");
    } catch (_) {}
  </script>
  <!-- Pre-JS splash. It sits OUTSIDE #root so React's first render can't rip it
       away in a single frame; main.tsx crossfades it out once the app mounts. -->
  <style>
    #boot-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #1c1c1e;
      /* Held until the app is ready, then dissolved away in one pass. The
         gentle ease-out reads as an intentional reveal rather than a cut. */
      opacity: 1;
      transition: opacity 520ms cubic-bezier(0.4, 0, 0.2, 1);
    }
    #boot-splash.is-hiding { opacity: 0; }
    /* Exactly mirrors the native launch screen: the same artwork, in a 224pt
       box, aspect-fit and centred. It is inlined as a data URI rather than
       linked, because even a preloaded file needs a fetch + decode — during
       which iOS had already faded the launch screen out, so the K visibly
       dipped away and came back. Inlined, it paints on the very first frame. */
    #boot-splash .mark {
      width: min(224px, 58vw);
      height: min(224px, 58vw);
      object-fit: contain;
      display: block;
      -webkit-touch-callout: none;
      -webkit-user-drag: none;
      user-select: none;
    }
    /* ONE launch look, always dark — identical to the native launch screen in
       every theme and on every device. Nothing here reads the theme, so there
       is no way for the splash and the launch screen to ever disagree. */
    @media (prefers-reduced-motion: reduce) {
      #boot-splash { transition-duration: 1ms; }
    }
  </style>
</head>
