<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Pinch-zoom stays enabled for accessibility; iOS input-focus zoom is
       prevented by keeping all form controls at >=16px (see index.css). -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Klimb</title>

  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1c1c1e">
  <!-- Standalone (home-screen) status bar: keep it dark, never the default white. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="apple-touch-icon" href="/klimb-app-icon.png">
  <link rel="preload" as="image" href="/klimb-splash-dark.png">
  <link rel="preload" as="image" href="/klimb-splash-light.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">

  <!-- Warm up the map tile CDN so the first map open paints fast. -->
  <link rel="preconnect" href="https://a.basemaps.cartocdn.com" crossorigin>
  <link rel="preconnect" href="https://b.basemaps.cartocdn.com" crossorigin>
  <link rel="preconnect" href="https://c.basemaps.cartocdn.com" crossorigin>

  <script>
    /* Paint the saved theme before the first frame. Klimb is a dark-first app:
       the default is dark (matching the native launch screen, which is pinned
       to dark), and light is an explicit opt-in from Settings. The splash then
       follows that same theme — light shows the green mark on white, dark
       shows the white mark on black — so you never see the other one. */
    try {
      var savedTheme = localStorage.getItem("klimb-theme");
      var bootTheme = savedTheme === "light" ? "light" : "dark";
      document.documentElement.dataset.theme = bootTheme;
      document.documentElement.style.colorScheme = bootTheme;
      document
        .querySelector('meta[name="theme-color"]')
        .setAttribute("content", bootTheme === "light" ? "#ffffff" : "#1c1c1e");
    } catch (_) {}
  </script>
  <!-- Pre-JS splash. It sits OUTSIDE #root so React's first render can't rip it
       away in a single frame; main.tsx crossfades it out once the app mounts. -->
  <style>
    #boot-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #1c1c1e;
      /* Held until the app is ready, then dissolved away in one pass. The
         gentle ease-out reads as an intentional reveal rather than a cut. */
      opacity: 1;
      transition: opacity 520ms cubic-bezier(0.4, 0, 0.2, 1);
    }
    #boot-splash.is-hiding { opacity: 0; }
    #boot-splash .mark {
      width: min(224px, 58vw);
      height: min(224px, 58vw);
      object-fit: contain;
      opacity: 1;
      transform: none;
    }
    /* Follows the user's chosen theme: light = green mark on white,
       dark = white mark on black. Dark is the default and matches the native
       launch screen exactly, so the handoff is invisible. */
    :root[data-theme="light"] #boot-splash { background: #fff; }
    #boot-splash .light-mark { display: none; }
    :root[data-theme="light"] #boot-splash .light-mark { display: block; }
    :root[data-theme="light"] #boot-splash .dark-mark { display: none; }
    @media (prefers-reduced-motion: reduce) {
      #boot-splash { transition-duration: 1ms; }
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <div id="boot-splash">
    <img class="mark dark-mark" src="/klimb-splash-dark.png" alt="Klimb" />
    <img class="mark light-mark" src="/klimb-splash-light.png" alt="Klimb" />
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
