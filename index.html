<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Pinch-zoom stays enabled for accessibility; iOS input-focus zoom is
       prevented by keeping all form controls at >=16px (see index.css). -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Klimb</title>

  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#04130c">
  <!-- Standalone (home-screen) status bar: keep it dark, never the default white. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="apple-touch-icon" href="/klimb-app-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">

  <!-- Warm up the map tile CDN so the first map open paints fast. -->
  <link rel="preconnect" href="https://a.basemaps.cartocdn.com" crossorigin>
  <link rel="preconnect" href="https://b.basemaps.cartocdn.com" crossorigin>
  <link rel="preconnect" href="https://c.basemaps.cartocdn.com" crossorigin>

  <!-- Pre-JS splash so the very first paint is branded, not blank. React
       replaces #root on mount, removing this automatically. Styles are inline
       here (the stylesheet hasn't loaded yet at first paint). -->
  <style>
    /* Mirrors the React splash so the native-to-web handoff stays seamless. */
    #boot-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-direction: column;
      gap: 12px;
      background:
        radial-gradient(circle at 50% 48%, rgba(57,255,136,.09), transparent 29%),
        #050706;
    }
    #boot-splash .mark {
      width: min(276px, 66vw);
      height: min(276px, 66vw);
      object-fit: contain;
      color: #f2efe8;
      filter: drop-shadow(0 22px 42px rgba(0,0,0,.5));
      animation: boot-in 1.45s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    #boot-splash .name {
      margin: -2px 0 0;
      color: rgba(244,245,242,.78);
      font: 800 15px/1 -apple-system, BlinkMacSystemFont, sans-serif;
      letter-spacing: .46em;
      text-indent: .46em;
      text-transform: uppercase;
      opacity: 0;
      animation: boot-name .8s ease-out .5s both;
    }
    @keyframes boot-in {
      0% { transform: scale(0.88); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes boot-name { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      #boot-splash .mark { animation: none; }
    }
  </style>
</head>

<body>
  <div id="root">
    <div id="boot-splash">
      <img class="mark" src="/klimb-k.svg" alt="Klimb" />
      <p class="name">Klimb</p>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
