<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Klimb App Store Preview</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #070908;
        --surface: #161719;
        --surface-2: #202125;
        --border: #2c2d32;
        --chalk: #f5f5f2;
        --muted: #9a9aa2;
        --faint: #6b6b73;
        --green: #39ff88;
        --green-2: #20c86b;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
      body {
        background:
          radial-gradient(circle at 50% 34%, rgba(57,255,136,.16), transparent 31%),
          radial-gradient(circle at 12% 10%, rgba(57,255,136,.06), transparent 28%),
          linear-gradient(160deg, #0b110e 0%, var(--bg) 48%, #050706 100%);
        color: var(--chalk);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .canvas {
        width: 100%;
        height: 100%;
        padding: 5.3% 6.2% 0;
        position: relative;
        display: flex;
        flex-direction: column;
      }
      .brand { display: flex; align-items: center; gap: 1.4vw; }
      .brand img {
        width: clamp(52px, 5vw, 84px);
        height: clamp(52px, 5vw, 84px);
        object-fit: cover;
        border-radius: 22%;
        box-shadow: 0 10px 35px rgba(0,0,0,.38);
      }
      .brand span {
        font-size: clamp(26px, 2.6vw, 44px);
        font-weight: 820;
        letter-spacing: -.04em;
      }
      .eyebrow {
        margin-top: 5.2%;
        color: var(--green);
        font-size: clamp(20px, 1.7vw, 32px);
        font-weight: 800;
        letter-spacing: .19em;
      }
      h1 {
        max-width: 88%;
        margin: 1.2% 0 0;
        font-size: clamp(70px, 7.2vw, 126px);
        line-height: .98;
        letter-spacing: -.065em;
        font-weight: 860;
      }
      .sub {
        margin-top: 2%;
        color: #b9bbb8;
        font-size: clamp(25px, 2.25vw, 42px);
        font-weight: 620;
        letter-spacing: -.025em;
      }
      .device {
        position: absolute;
        left: 5.4%;
        right: 5.4%;
        top: 31.5%;
        bottom: -2.5%;
        border: 2px solid rgba(255,255,255,.11);
        border-radius: 6.3vw 6.3vw 0 0;
        background: #0a0a0b;
        overflow: hidden;
        box-shadow:
          0 -1px 0 rgba(255,255,255,.08) inset,
          0 55px 110px rgba(0,0,0,.58),
          0 0 100px rgba(57,255,136,.09);
      }
      .island {
        position: absolute; top: 1.2%; left: 50%; transform: translateX(-50%);
        width: 25%; height: 1.65%; border-radius: 999px; background: #020202; z-index: 5;
      }
      .screen {
        position: absolute; inset: 0;
        padding: 6.2% 4.7% 12%;
        background:
          radial-gradient(circle at 85% 4%, rgba(57,255,136,.045), transparent 23%),
          #0a0a0b;
      }
      .status { height: 2.5%; }
      .app-kicker { color: var(--muted); font-size: clamp(18px, 1.55vw, 30px); }
      .app-title {
        margin-top: .4%;
        font-size: clamp(46px, 4.2vw, 74px);
        font-weight: 850;
        letter-spacing: -.055em;
      }
      .header-row { display: flex; justify-content: space-between; align-items: center; }
      .bell {
        width: clamp(38px, 3.7vw, 66px); height: clamp(38px, 3.7vw, 66px);
        color: var(--muted);
      }
      .metric-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 2.1%; margin-top: 5%; }
      .metric {
        background: var(--surface); border-radius: 2.4vw; padding: 6.2% 3%;
        text-align: center; box-shadow: 0 18px 32px rgba(0,0,0,.18);
      }
      .metric b { display:block; font-size: clamp(42px, 4vw, 68px); line-height: 1; }
      .metric span { display:block; color:var(--muted); margin-top: 8%; font-size: clamp(16px,1.45vw,26px); letter-spacing:.08em; }
      .metric small { display:block; color:var(--green); margin-top: 5%; font-size: clamp(13px,1.15vw,22px); }
      .stats-link {
        margin-top: 3.2%; padding: 3.4% 4.2%; border-radius: 2.2vw; background: var(--surface);
        display:flex; align-items:center; gap:2%; font-size: clamp(22px,2vw,36px); font-weight:750;
      }
      .trend { color:var(--green); font-size:1.25em; }
      .segmented {
        display:grid; grid-template-columns:1fr 1fr; gap:1%; margin-top: 4.2%; padding:.8%;
        border-radius:999px; background:var(--surface-2);
      }
      .segmented span { padding:2.4% 2%; text-align:center; font-size:clamp(20px,1.9vw,34px); font-weight:750; color:var(--muted); border-radius:999px; }
      .segmented .active { background:var(--green); color:#06140c; }
      .section-label { margin:4.4% 1.2% 2.1%; color:var(--faint); font-size:clamp(17px,1.5vw,28px); font-weight:800; letter-spacing:.08em; }
      .route-list { display:flex; flex-direction:column; gap:1.6vw; }
      .route {
        display:grid; grid-template-columns: 15% 1fr auto; align-items:center; gap:3%;
        padding:2.5% 3%; border-radius:2.25vw; background:var(--surface);
      }
      .photo { aspect-ratio:1; border-radius:24%; position:relative; overflow:hidden; }
      .photo.one { background:linear-gradient(135deg,#26282b 0 30%,#bb3f44 31% 39%,#44484c 40% 65%,#d3b047 66% 74%,#292b2f 75%); }
      .photo.two { background:linear-gradient(145deg,#4c555c,#88929b 36%,#2a2d30 37% 52%,#e55b8e 53% 61%,#4a4d50 62%); }
      .photo.three { background:linear-gradient(135deg,#6f7477,#343639 42%,#3979d2 43% 50%,#26282b 51%); }
      .route-name { display:flex; align-items:center; gap:3%; font-size:clamp(24px,2.2vw,39px); font-weight:780; }
      .dot { width:.72em; height:.72em; border-radius:50%; display:inline-block; flex:none; }
      .dot.orange{background:#ff7417}.dot.blue{background:#3f82ee}.dot.pink{background:#e83d93}
      .route-meta { display:flex; align-items:center; gap:5%; margin-top:3%; color:var(--muted); font-size:clamp(15px,1.35vw,24px); }
      .pill { background:#222328; border-radius:999px; padding:2% 5%; font-weight:800; letter-spacing:.06em; }
      .pill.flash { background:#123c28; color:var(--green); }
      .grade { text-align:right; min-width:7.5em; }
      .grade b { color:var(--green); font-size:clamp(28px,2.8vw,48px); letter-spacing:-.03em; white-space:nowrap; }
      .grade span { display:block; margin-top:3%; color:var(--muted); font-size:clamp(14px,1.25vw,23px); }
      .nav {
        position:absolute; left:3%; right:3%; bottom:2.1%; height:7.7%;
        display:grid; grid-template-columns:repeat(5,1fr); align-items:center;
        border:1px solid var(--border); background:rgba(22,23,25,.98); border-radius:999px;
        box-shadow:0 12px 30px rgba(0,0,0,.45);
      }
      .nav span { text-align:center; color:var(--faint); font-size:clamp(14px,1.15vw,21px); font-weight:700; line-height:1.15; }
      .nav i { display:block; font-style:normal; font-size:1.7em; margin-bottom:.1em; }
      .nav .on { color:var(--green); }
      .nav .plus i {
        width:2.4em; height:2.4em; margin:-1.25em auto .1em; display:flex; align-items:center; justify-content:center;
        border-radius:50%; background:var(--green); color:#06140c; font-size:2em; box-shadow:0 0 0 .22em var(--surface);
      }

      /* Logging screen */
      .log-card-title { color:var(--muted); font-size:clamp(19px,1.6vw,30px); margin:4% 1% 2%; }
      .choices { display:grid; gap:2%; }
      .choices.two { grid-template-columns:1fr 1fr; }
      .choices.three { grid-template-columns:repeat(3,1fr); }
      .choice {
        padding:6.5% 3%; border:1px solid var(--border); border-radius:2.4vw; background:var(--surface-2);
        text-align:center; color:var(--muted);
      }
      .choice strong { display:block; font-size:clamp(23px,2.05vw,38px); margin-top:2%; }
      .choice small { display:block; font-size:clamp(14px,1.18vw,22px); margin-top:2%; color:var(--faint); }
      .choice.selected { background:#0d2d1d; border:2px solid var(--green); color:var(--green); }
      .photo-add {
        height:18%; margin-top:2%; border-radius:2.5vw; background:var(--surface-2);
        display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--muted);
      }
      .photo-add b { font-size:clamp(42px,4vw,72px); color:var(--green); }
      .photo-add span { font-size:clamp(18px,1.55vw,29px); margin-top:1%; }
      .field-card { margin-top:3%; padding:3.5%; background:var(--surface); border-radius:2.2vw; }
      .field { display:flex; justify-content:space-between; align-items:center; padding:2.2% 0; font-size:clamp(18px,1.55vw,29px); }
      .field + .field { border-top:1px solid var(--border); margin-top:2%; padding-top:4%; }
      .select { padding:1.7% 3%; border-radius:999px; background:var(--surface-2); color:var(--chalk); font-weight:750; }
      .save {
        margin-top:3%; width:100%; padding:3.3%; border-radius:999px; background:var(--green); color:#06140c;
        text-align:center; font-size:clamp(24px,2.2vw,40px); font-weight:850;
      }

      /* Stats screen */
      .hero-stat {
        margin-top:4%; padding:4.2%; border-radius:2.5vw; background:
          radial-gradient(circle at 50% 0, rgba(57,255,136,.12),transparent 55%), var(--surface);
        text-align:center;
      }
      .hero-stat b { display:block; color:var(--green); font-size:clamp(70px,7.6vw,132px); line-height:.95; }
      .hero-stat strong { display:block; font-size:clamp(22px,2.1vw,38px); margin-top:1.5%; }
      .hero-stat span { display:block; color:var(--muted); font-size:clamp(16px,1.45vw,27px); margin-top:2%; }
      .streak { margin-top:2.8%; padding:3.5% 4%; border-radius:2.3vw; background:var(--surface); display:flex; align-items:center; gap:4%; }
      .flame { font-size:clamp(46px,4.5vw,78px); }
      .streak b { font-size:clamp(34px,3.2vw,56px); }
      .streak span { display:block; color:var(--muted); font-size:clamp(16px,1.4vw,26px); margin-top:2%; }
      .bests { margin-top:2.8%; padding:3.5% 4%; border-radius:2.3vw; background:var(--surface); }
      .card-label { color:var(--faint); font-size:clamp(17px,1.45vw,27px); font-weight:800; letter-spacing:.08em; }
      .best-row { display:grid; grid-template-columns:1fr repeat(3,auto); gap:5%; align-items:end; margin-top:3%; }
      .best-row strong { font-size:clamp(20px,1.7vw,32px); }
      .best-grade { text-align:center; }
      .best-grade b { display:block; color:var(--green); font-size:clamp(28px,2.75vw,48px); white-space:nowrap; }
      .best-grade span { color:var(--faint); font-size:clamp(11px,1vw,19px); letter-spacing:.07em; }
      .pyramid { margin-top:2.8%; padding:3.6% 4%; border-radius:2.3vw; background:var(--surface); }
      .pyramid-head { display:flex; justify-content:space-between; align-items:center; }
      .toggle { padding:.8%; background:var(--surface-2); border-radius:999px; }
      .toggle span { display:inline-block; padding:.5em 1em; border-radius:999px; color:var(--muted); font-size:clamp(12px,1vw,19px); font-weight:750; }
      .toggle .active { background:var(--green); color:#06140c; }
      .bars { display:flex; align-items:flex-end; justify-content:center; gap:3%; height:12.5vw; max-height:220px; margin-top:3%; }
      .bar { width:9%; border-radius:999px 999px 4px 4px; background:linear-gradient(#39ff88,#168849); position:relative; min-height:15%; }
      .bar::after { content:attr(data-g); position:absolute; left:50%; bottom:-2em; transform:translateX(-50%); color:var(--muted); font-size:clamp(11px,1vw,18px); font-weight:700; }

      @media (min-aspect-ratio: .7) {
        .canvas { padding: 4.2% 5.2% 0; }
        .brand img { width: 72px; height:72px; }
        .eyebrow { margin-top:3.3%; }
        h1 { max-width:70%; font-size:clamp(74px,6.2vw,124px); }
        .sub { margin-top:1.3%; }
        .device { left:8%; right:8%; top:27.5%; border-radius:5vw 5vw 0 0; }
        .screen { padding-left:6%; padding-right:6%; }
        .route-list { gap:1.2vw; }
      }
    </style>
  </head>
  <body>
    <main class="canvas">
      <div class="brand">
        <img src="/brand/klimb-logo-dark.png" alt="" />
        <span>Klimb</span>
      </div>
      <div class="eyebrow" id="eyebrow"></div>
      <h1 id="headline"></h1>
      <div class="sub" id="sub"></div>
      <section class="device">
        <div class="island"></div>
        <div class="screen" id="screen"></div>
      </section>
    </main>
    <script>
      // Explicit artboard dimensions let the capture tool export Apple-native
      // pixels even when the browser window itself is shorter than the artwork.
      const captureParams = new URLSearchParams(location.search);
      const captureWidth = Number(captureParams.get("w"));
      const captureHeight = Number(captureParams.get("h"));
      if (captureWidth > 0 && captureHeight > 0) {
        document.documentElement.style.width = `${captureWidth}px`;
        document.documentElement.style.height = `${captureHeight}px`;
        document.body.style.width = `${captureWidth}px`;
        document.body.style.height = `${captureHeight}px`;
      }
      const bell = `<svg class="bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg>`;
      const nav = (on) => `<div class="nav">
        <span class="${on==='book'?'on':''}"><i>▢</i>Logbook</span>
        <span><i>⌖</i>Map</span>
        <span class="plus ${on==='log'?'on':''}"><i>+</i>Log</span>
        <span class="${on==='stats'?'on':''}"><i>▥</i>Stats</span>
        <span><i>♙</i>Profile</span>
      </div>`;
      const route = (photo,color,name,badge,date,grade,type,flash=false) => `<div class="route">
        <div class="photo ${photo}"></div>
        <div>
          <div class="route-name"><i class="dot ${color}"></i>${name}</div>
          <div class="route-meta"><span class="pill ${flash?'flash':''}">${flash?'ϟ FLASH':'✓ SEND'}</span><span>${date}</span></div>
        </div>
        <div class="grade"><b>${grade}</b><span>${type}</span></div>
      </div>`;
      const scenes = {
        logbook: {
          eyebrow: "YOUR CLIMBING, REMEMBERED",
          headline: "Every send.<br>One clean logbook.",
          sub: "Routes, projects and progress—always in reach.",
          html: `<div class="status"></div><div class="header-row"><div><div class="app-kicker">Klimbing out of Climb Bentonville</div><div class="app-title">Sends</div></div>${bell}</div>
            <div class="metric-grid"><div class="metric"><b>42</b><span>SENDS</span></div><div class="metric"><b>11</b><span>FLASHES</span></div><div class="metric"><b>7</b><span>THIS WEEK</span><small>+3 vs last wk</small></div></div>
            <div class="stats-link"><span class="trend">↗</span>Your pyramid, streaks & records</div>
            <div class="segmented"><span class="active">Sends</span><span>Projects</span></div>
            <div class="section-label">THIS WEEK</div><div class="route-list">
              ${route('one','orange','Orange','send','Today','V4','Boulder')}
              ${route('two','pink','Pink','flash','Jul 26','V5','Boulder',true)}
              ${route('three','blue','Blue','send','Jul 24','5.11c','Lead')}
            </div>${nav('book')}`
        },
        log: {
          eyebrow: "LESS TAPPING. MORE KLIMBING.",
          headline: "Log a Klimb<br>in seconds.",
          sub: "Add the photo, grade and result while it’s fresh.",
          html: `<div class="status"></div><div class="app-kicker">Climb Bentonville</div><div class="app-title">Log a Klimb</div>
            <div class="log-card-title">Type of Klimb</div><div class="choices two"><div class="choice selected"><strong>△ Boulder</strong><small>No rope</small></div><div class="choice"><strong>〰 Rope</strong><small>Top rope or lead</small></div></div>
            <div class="log-card-title">How’d it go?</div><div class="choices three"><div class="choice"><strong>ϟ Flash</strong><small>First try</small></div><div class="choice selected"><strong>✓ Sent</strong><small>Clean</small></div><div class="choice"><strong>▱ Project</strong><small>Working it</small></div></div>
            <div class="log-card-title">Photo</div><div class="photo-add"><b>▧+</b><span>Take photo or choose from library</span></div>
            <div class="field-card"><div class="field"><b>Hold color</b><span class="select">Blue⌄</span></div><div class="field"><b>Gym’s grade</b><span class="select">V4⌄</span></div></div>
            <div class="save">Save Klimb</div>${nav('log')}`
        },
        stats: {
          eyebrow: "PROGRESS YOU CAN SEE",
          headline: "Watch your work<br>take shape.",
          sub: "Streaks, records and grade pyramids in one view.",
          html: `<div class="status"></div><div class="header-row"><div><div class="app-kicker">Your Klimbing, in numbers</div><div class="app-title">Stats</div></div></div>
            <div class="hero-stat"><b>58</b><strong>Klimbs logged</strong><span>42 sends · 11 flashes · 26% first try</span></div>
            <div class="streak"><div class="flame">🔥</div><div><b>6 week streak</b><span>Three sessions this week. Keep it going.</span></div></div>
            <div class="bests"><div class="card-label">PERSONAL BESTS</div><div class="best-row"><strong>Hardest send</strong><div class="best-grade"><b>V6</b><span>BOULDER</span></div><div class="best-grade"><b>5.12b</b><span>TOP ROPE</span></div><div class="best-grade"><b>5.11d</b><span>LEAD</span></div></div></div>
            <div class="pyramid"><div class="pyramid-head"><div class="card-label">GRADE PYRAMID</div><div class="toggle"><span class="active">Boulder</span><span>Rope</span></div></div><div class="bars"><div class="bar" data-g="V1" style="height:28%"></div><div class="bar" data-g="V2" style="height:48%"></div><div class="bar" data-g="V3" style="height:84%"></div><div class="bar" data-g="V4" style="height:100%"></div><div class="bar" data-g="V5" style="height:62%"></div><div class="bar" data-g="V6" style="height:26%"></div></div></div>
            ${nav('stats')}`
        }
      };
      const key = captureParams.get("scene") || "logbook";
      const scene = scenes[key] || scenes.logbook;
      document.getElementById("eyebrow").textContent = scene.eyebrow;
      document.getElementById("headline").innerHTML = scene.headline;
      document.getElementById("sub").textContent = scene.sub;
      document.getElementById("screen").innerHTML = scene.html;
    </script>
  </body>
</html>
